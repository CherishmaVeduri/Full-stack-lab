<!DOCTYPE html>
<html>
<head>
    <title>Date and Time</title>
</head>

<body>

<h1>Current Date and Time</h1>

<p id="time"></p>

<button onclick="showTime()">Show Date & Time</button>

<script>
function showTime()
{
    document.getElementById("time").innerHTML = new Date();
}
</script>

</body>
</html>
