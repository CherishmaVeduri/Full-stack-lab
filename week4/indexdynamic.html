<!DOCTYPE html>
<html>
    <head>
        <title>Dynamic Webpage</title>
        <style>
            body{
                font-family:Arial;
                text-align:center;
                margin-top:100px;
            }
            button{
                padding:10px 20px;
                font-size:18px;
            }
            h2{
                color:brown;
            }
        </style>
    </head>
    <body>
        <h1>Dynamic webpage using javascript</h1>
        <h2 id="message">
            Welcome!
        </h2>
        <button onclick="changeText()">
            ClickMe
            </button>

            <script> 

                function changeText()
                {
                    document.getElementById("message").innerHTML=
                    "You clicked the button successfully!";
                }
            </script>
    </body>
</html>
